[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-traceability-lab"
version = "0.1.0"
description = "Controlled local LLM experiments with source traceability and recorded evaluation."
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "uvicorn>=0.34,<1",
  "sqlite-vec>=0.1.6,<0.2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "prov>=2,<3",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3,<6"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/traceability_lab"]

[tool.ruff]
target-version = "py314"
line-length = 110
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "model: requires configured local model artifacts and a running llama.cpp server",
  "browser: optional isolated Playwright browser tests",
]
